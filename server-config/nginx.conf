# Drop this server block into your nginx config and set root to the "site" folder.
server {
    listen 80;
    listen [::]:80;
    server_name beronilla.rodeo www.beronilla.rodeo;
    return 301 https://beronilla.rodeo$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.beronilla.rodeo;
    # ssl_certificate / ssl_certificate_key: your certs (certbot works fine)
    return 301 https://beronilla.rodeo$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beronilla.rodeo;
    # ssl_certificate     /etc/letsencrypt/live/beronilla.rodeo/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/beronilla.rodeo/privkey.pem;

    root /var/www/beronilla.rodeo/site;
    index index.html;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-B/Lg1CTCd7lLGp9NoXqJXOWxw2axp951s1WKy6Qg6HI='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /404.html { internal; }
    location ~* \.(css|js|svg)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri/ =404; }
}
