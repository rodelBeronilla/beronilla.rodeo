name: CI

on:
  pull_request:
  push:
    branches: [main, preprod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36})' -- . ':!.github/workflows/ci.yml'; then
            echo "Possible secret committed"; exit 1
          fi
      - name: Validate workflow YAML
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open('$f'))" || exit 1
          done
